name: Validate Codex and DSH distributions

on:
  push:
    branches: [main]
    paths: ['skills/**', 'plugins/**', 'tools/**', 'tests/**', '.github/workflows/**', '.gitattributes']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: distributions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: '3.14'
          - os: ubuntu-latest
            python: '3.11'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Isolate test data from the checkout
        run: |
          "ANIME_TRACKING_STATE=$env:RUNNER_TEMP/codex-anime-tests/state.json" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ANIME_DSH_HOME=$env:RUNNER_TEMP/dsh-anime-tests" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "DSH_TEST_NODE_MODULES=$env:RUNNER_TEMP/dsh-test-deps/node_modules" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Keep native Windows assertions on the Windows runner
        if: runner.os != 'Windows'
        run: |
          # These fixtures invoke Win32 APIs or assert Windows-only branches.
          # Windows runs the full suite; keep all other tests on Linux as well.
          $windowsOnly = @(
            'test_client_context_preflight.py::test_sandbox_identity_fails_closed_before_client_launch'
            'test_qbittorrent_submit.py::QbittorrentSubmitTests::test_absence_is_distinct_from_failed_probe'
            'test_qbittorrent_submit.py::QbittorrentSubmitTests::test_exact_installation_is_running'
            'test_qbittorrent_submit.py::QbittorrentSubmitTests::test_other_installation_is_not_reused'
            'test_qbittorrent_submit.py::QbittorrentSubmitTests::test_permission_denial_is_not_a_transient_network_failure'
            'test_windows_client_runtime.py::test_running_installation_wins_over_old_known_install'
            'test_windows_client_runtime.py::test_multiple_active_installations_are_a_conflict'
            'test_windows_client_runtime.py::test_newer_portable_beats_running_registered_version_and_detects_updates'
            'test_windows_client_runtime.py::test_equal_versions_prefer_running_copy'
            'test_windows_client_runtime.py::test_unknown_version_does_not_silently_select_old_copy'
            'test_windows_client_runtime.py::test_broker_failure_never_falls_back_to_direct_client_launch'
          )
          $options = ($windowsOnly | ForEach-Object { "--deselect=skills/find-nyaa-anime-release/tests/$_" }) -join ' '
          "PYTEST_ADDOPTS=$options" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install test-only dependencies without lifecycle scripts
        run: |
          python -m pip install pytest hypothesis tzdata
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm install --prefix '${{ runner.temp }}/dsh-test-deps' --ignore-scripts --no-audit --no-fund @deepseek-ai/cordis@4.1.0 @deepseek-ai/dsh-skill@0.2.2-rc.1 @deepseek-ai/dsh-plugin-market-index@0.2.2-rc.1 yaml@2.8.1 semver@7.7.3
      - name: Check synchronized generated payload
        run: python -m pytest tests/test_distribution_sync.py -q -p no:cacheprovider
      - name: Test Codex distribution
        run: python -m pytest skills/find-nyaa-anime-release/tests -q -m 'not live' -p no:cacheprovider
      - name: Test DSH distribution
        working-directory: plugins/dsh-find-nyaa-anime-release
        run: python -m pytest tests/test_dsh_adapter.py skills/find-nyaa-anime-release/tests -q -m 'not live' -p no:cacheprovider
      - name: Check native registry and market metadata
        working-directory: plugins/dsh-find-nyaa-anime-release
        run: node --test tests/plugin.test.mjs
      - name: Build and verify distributable archives
        working-directory: plugins/dsh-find-nyaa-anime-release
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          npm pack --ignore-scripts --pack-destination '${{ runner.temp }}'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/verify_and_archive.py --tarball "${{ runner.temp }}/dsh-find-nyaa-anime-release-$version.tgz" --output-dir '${{ runner.temp }}/dsh-release'
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-package-${{ matrix.os }}
          path: ${{ runner.temp }}/dsh-release/
